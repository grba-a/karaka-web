  <g fill="none" stroke="#D9B478" stroke-linejoin="round">
    <circle cx="32" cy="32" r="26" stroke-width="2"/>
    <circle cx="32" cy="32" r="22.5" stroke-width="1" opacity=".5"/>
    <!-- jarbol -->
